name: checks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  minecraft-cosmetics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: cosmetics_test
          POSTGRES_USER: cosmetics_test
          POSTGRES_PASSWORD: cosmetics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmetics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install isolated cosmetics test dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-ci.txt
      - name: Validate catalog, UI and durable placement queue
        run: |
          python scripts/build_minecraft_cosmetics.py --check
          python scripts/check_build_minecraft_cosmetics.py
          python scripts/check_minecraft_cosmetics.py
          python scripts/check_minecraft_resource_packs.py
          python scripts/check_minecraft_cosmetics_admin.py
          python scripts/check_minecraft_cosmetics_apply.py
          node scripts/check_minecraft_junket.mjs
          python scripts/check_minecraft_junket_analysis.py
          python scripts/check_minecraft_junket_warp.py
          python scripts/minecraft/build_junket_warp.py --check
          python scripts/minecraft/build_junket_original_world.py --check
          node scripts/check_minecraft_junket_warp.mjs
          node scripts/check_minecraft_junket_production.mjs
          node scripts/check_minecraft_junket_temperance.mjs
          node scripts/check_minecraft_junket_lucy.mjs
          node scripts/check_minecraft_junket_silence.mjs
          node scripts/check_minecraft_junket_jinn.mjs
          node scripts/check_minecraft_junket_ace.mjs
          node scripts/check_minecraft_junket_complete.mjs
          node scripts/check_minecraft_junket_ui.mjs
          node scripts/check_minecraft_junket_playthrough.mjs
          node scripts/check_minecraft_junket_reception.mjs
          node scripts/check_minecraft_junket_venue.mjs
          python scripts/check_minecraft_cosmetics_db.py
          node scripts/check_minecraft_cosmetics.mjs
          python scripts/check_minecraft_avatars.py
          node scripts/check_minecraft_avatar_bridge.mjs
          python scripts/check_minecraft_posters.py
          python scripts/check_minecraft_lead_anchors.py
          python scripts/check_minecraft_pikachu.py
          python scripts/check_minecraft_mokuro.py
          python scripts/check_minecraft_priority_one.py
          python scripts/check_minecraft_garbage_molcar.py
          node scripts/check_minecraft_molcar_boost.mjs
          python scripts/check_molcar_records.py
          node scripts/check_molcar_records.mjs
          node scripts/check_narita_poll_serialization.mjs
          node scripts/check_minecraft_client_performance.mjs
          python scripts/check_minecraft_managed_posters.py
          node scripts/check_minecraft_managed_posters.mjs
          python scripts/check_minecraft_wall_displays.py
          python scripts/check_minecraft_big_video.py
          python scripts/check_minecraft_akki_video.py
          python scripts/build_aquarium_glass.py --check
          python scripts/check_aquarium_glass.py
          python scripts/check_minecraft_death_prairie_dog.py
          python scripts/check_taketumi_ai.py

  python-and-compose:
    # PG16 restore tools are available in Noble; ubuntu-latest can move majors.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: routing_test
          POSTGRES_USER: routing_test
          POSTGRES_PASSWORD: routing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --require-hashes -r requirements.txt

      - name: Check security regressions and locked dependencies
        run: |
          python scripts/check_admin_security.py
          python scripts/check_database_credential_rotation.py
          python scripts/check_voice_crypto.py
          python scripts/check_media_egress.py
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit --no-deps --disable-pip -r requirements.txt

      - name: Install media and isolated backup restore test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-16

      - name: Compile Python
        run: |
          python -m compileall admin bot scripts
          python scripts/check_media_security.py

      - name: Run AI task execution checks
        run: |
          python scripts/check_ai_task_deploy.py
          python scripts/check_ai_task_storage.py
          python scripts/check_ai_task_storage_retention.py
          python scripts/check_ai_task_storage_cleanup.py
          python scripts/check_ai_task_storage_maintenance.py
          python scripts/check_ai_task_storage_disposition.py
          python scripts/check_ai_task_storage_evidence.py
          python scripts/check_ai_task_storage_evidence_store.py
          python scripts/check_ai_task_storage_evidence_classification.py
          python scripts/check_ai_task_storage_evidence_v2.py
          python scripts/check_ai_task_storage_monitor.py
          python scripts/check_recovery_history.py
          python scripts/check_ai_task_recovery_plan.py
          python scripts/check_ai_task_backup_restore.py --postgres-bin /usr/lib/postgresql/16/bin -v
          python scripts/check_ai_task_backup_split.py
          python scripts/check_ai_task_control_tunnel.py
          python scripts/check_nethernet_diagnostics.py
          python scripts/check_minecraft_control_status.py
          python scripts/check_minecraft_diagnostics.py
          bash -n scripts/ai_task_deploy_remote.sh
          python scripts/check_ai_tasks.py
          python scripts/check_ai_task_discord_channel.py
          python scripts/check_ai_task_control_plane.py
          python scripts/check_ai_task_phase2d_control_plane.py
          python scripts/check_ai_task_publish.py
          python scripts/check_ai_task_github.py
          python scripts/check_ai_task_review_merge.py
          python scripts/check_ai_task_auto_merge.py
          python scripts/check_ai_task_local_runner.py
          python scripts/check_ai_task_worktree_inspection.py
          python scripts/inspect_ai_task_worktree.py --help
          python scripts/check_ai_task_process.py
          python scripts/check_ai_task_linux.py
          python scripts/check_ai_task_minecraft_deploy.py
          python scripts/check_ai_task_minecraft_deploy_managed.py
          python scripts/check_ai_task_minecraft_runtime.py
          python scripts/check_resource_pack_versions_test.py

      - name: Enforce resource pack version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_resource_pack_versions.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run isolated DB runtime integration checks
        env:
          DATABASE_URL: postgresql://routing_test:routing_test@127.0.0.1:5432/routing_test
        run: |
          python scripts/migrate.py
          python scripts/check_guild_repository.py
          python scripts/check_message_router_db.py
          python scripts/check_runtime_db_role.py
          python scripts/check_migration_compatibility.py

      - name: Run message routing regression checks
        run: |
          python scripts/check_message_router.py
          python scripts/check_mention_on_message_routing.py
          python scripts/check_empty_mention_regression.py
          python scripts/check_mention_shortcuts_runtime.py
          python scripts/check_interaction_panel_runtime.py
          python scripts/check_minecraft_panel.py
          python scripts/check_mezamashi_horoscope.py
          python scripts/check_minecraft_narita_bridge.py
          python scripts/check_voice_vc_commands.py
          python scripts/check_music_tts_simultaneous_runtime.py
          python scripts/check_mention_guard_runtime.py
          python scripts/check_modes_runtime.py
          python scripts/check_random_draw_n_pull.py

      - name: Run static checks
        run: |
          python scripts/check_spotify_premium_free_runtime.py
          python scripts/check_spotify_web_api_removed.py
          python scripts/check_spotify_link_support.py
          python scripts/check_spotify_playlist_support.py
          python scripts/check_voice_music_queue_runtime.py
          python scripts/check_youtube_home_vpn_proxy.py
          python scripts/check_voice_music_pipeline.py
          python scripts/check_youtube_cookie_monitor.py
          python scripts/check_bot_scoped_guild_settings.py
          python scripts/check_admin_feature_flags.py
          python scripts/check_compose_profiles.py
          python scripts/check_service_environment_scoping.py
          python scripts/check_external_http_policy.py
          python scripts/check_deploy_scripts.py
          python scripts/check_voicevox_optional_runtime.py

      - name: Whitespace check
        run: git diff --check

      - name: Compose config
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile bot --profile youtube-vpn config --quiet
