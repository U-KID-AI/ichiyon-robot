name: checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  minecraft-cosmetics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cosmetics_test
          POSTGRES_USER: cosmetics_test
          POSTGRES_PASSWORD: cosmetics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmetics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install isolated cosmetics test dependencies
        run: python -m pip install Pillow fastapi jinja2 python-multipart "psycopg[binary]" httpx itsdangerous python-dotenv
      - name: Validate catalog, UI and durable placement queue
        run: |
          python scripts/build_minecraft_cosmetics.py --check
          python scripts/check_build_minecraft_cosmetics.py
          python scripts/check_minecraft_cosmetics.py
          python scripts/check_minecraft_resource_packs.py
          python scripts/check_minecraft_cosmetics_admin.py
          python scripts/check_minecraft_cosmetics_apply.py
          python scripts/check_minecraft_cosmetics_db.py
          node scripts/check_minecraft_cosmetics.mjs
          python scripts/check_minecraft_avatars.py
          node scripts/check_minecraft_avatar_bridge.mjs
          python scripts/check_minecraft_posters.py
          python scripts/check_minecraft_lead_anchors.py
          python scripts/check_minecraft_pikachu.py
          python scripts/check_minecraft_mokuro.py
          python scripts/check_minecraft_garbage_molcar.py
          node scripts/check_minecraft_molcar_boost.mjs
          python scripts/check_molcar_records.py
          node scripts/check_molcar_records.mjs
          node scripts/check_narita_poll_serialization.mjs
          python scripts/check_minecraft_managed_posters.py
          node scripts/check_minecraft_managed_posters.mjs
          python scripts/check_minecraft_wall_displays.py
          python scripts/check_minecraft_big_video.py
          python scripts/check_minecraft_death_prairie_dog.py
          python scripts/check_taketumi_ai.py

  python-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Compile Python
        run: python -m compileall admin bot scripts

      - name: Run AI task execution checks
        run: |
          python scripts/check_ai_task_deploy.py
          bash -n scripts/ai_task_deploy_remote.sh
          python scripts/check_ai_tasks.py
          python scripts/check_ai_task_discord_channel.py
          python scripts/check_ai_task_control_plane.py
          python scripts/check_ai_task_phase2d_control_plane.py
          python scripts/check_ai_task_publish.py
          python scripts/check_ai_task_github.py
          python scripts/check_ai_task_review_merge.py
          python scripts/check_ai_task_auto_merge.py
          python scripts/check_ai_task_local_runner.py
          python scripts/check_ai_task_worktree_inspection.py
          python scripts/inspect_ai_task_worktree.py --help
          python scripts/check_ai_task_process.py
          python scripts/check_ai_task_linux.py
          python scripts/check_ai_task_minecraft_deploy.py
          python scripts/check_ai_task_minecraft_deploy_managed.py
          python scripts/check_ai_task_minecraft_runtime.py
          python scripts/check_resource_pack_versions_test.py

      - name: Enforce resource pack version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_resource_pack_versions.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run static checks
        run: |
          python scripts/check_spotify_premium_free_runtime.py
          python scripts/check_spotify_web_api_removed.py
          python scripts/check_spotify_link_support.py
          python scripts/check_spotify_playlist_support.py
          python scripts/check_voice_music_queue_runtime.py
          python scripts/check_youtube_home_vpn_proxy.py
          python scripts/check_voice_music_pipeline.py
          python scripts/check_youtube_cookie_monitor.py
          python scripts/check_bot_scoped_guild_settings.py
          python scripts/check_admin_feature_flags.py
          python scripts/check_compose_profiles.py
          python scripts/check_service_environment_scoping.py
          python scripts/check_external_http_policy.py
          python scripts/check_deploy_scripts.py
          python scripts/check_voicevox_optional_runtime.py

      - name: Whitespace check
        run: git diff --check

      - name: Compose config
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile bot --profile youtube-vpn config --quiet
