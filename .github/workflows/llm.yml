name: llm-chat
on:
  pull_request:
    paths: ['bot/services/llm_*.py', 'bot/message_routing.py', 'scripts/*llm*.py', 'migrations/*llm*.sql', '.github/workflows/llm.yml']
  push:
    branches: [main]
    paths: ['bot/services/llm_*.py', 'bot/message_routing.py', 'scripts/*llm*.py', 'migrations/*llm*.sql', '.github/workflows/llm.yml']
jobs:
  llm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: llm_test
          POSTGRES_USER: llm_test
          POSTGRES_PASSWORD: llm_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U llm_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install discord.py httpx 'psycopg[binary]' python-dotenv
      - run: python scripts/check_llm_chat.py
        env:
          LLM_TEST_DATABASE_URL: postgresql://llm_test:llm_test@localhost:5432/llm_test
      - run: python scripts/check_llm_corpus.py
      - run: python scripts/check_llm_rachel.py
      - run: python scripts/check_llm_context.py
      - run: python scripts/check_llm_limits.py
        env:
          LLM_TEST_DATABASE_URL: postgresql://llm_test:llm_test@localhost:5432/llm_test
